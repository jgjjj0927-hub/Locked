plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pidori.locker'
    compileSdk 33
    
    defaultConfig {
        applicationId "com.pidori.locker"
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }
    
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
